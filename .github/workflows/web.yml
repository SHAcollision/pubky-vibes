name: Web build

on:
  workflow_call:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install trunk
        run: cargo install trunk
      - name: Install wasm-opt dependencies
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Prepare wasm-opt wrapper for bulk-memory builds
        run: |
          cache_dir="$HOME/.cache/trunk/wasm-opt-version_123/bin"
          mkdir -p "$cache_dir"
          cp scripts/wasm-opt "$cache_dir/wasm-opt"
          chmod +x "$cache_dir/wasm-opt"
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Build web bundle
        run: trunk build --release --config Trunk.toml index.html
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dioxus-template-web
          path: dist/web
          if-no-files-found: error
