name: Web build

on:
  workflow_call:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install trunk
        run: cargo install trunk
      - name: Install wasm-bindgen-cli
        run: |
          WASM_BINDGEN_VERSION=0.2.106
          ARCHIVE="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${ARCHIVE}" -o "/tmp/${ARCHIVE}"
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp
          sudo mv "/tmp/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/wasm-bindgen
      - name: Install wasm-opt dependencies
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Prepare wasm-opt wrapper for bulk-memory builds
        run: |
          sudo mv /usr/bin/wasm-opt /usr/bin/wasm-opt-orig
          sudo cp scripts/wasm-opt /usr/bin/wasm-opt
          sudo chmod +x /usr/bin/wasm-opt
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Build web bundle
        env:
          TRUNK_WASM_BINDGEN: wasm-bindgen
        run: trunk build --release --config Trunk.toml index.html
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dioxus-template-web
          path: dist/web/**
          if-no-files-found: error
